name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Normalize line endings
        run: |
          find src -type f \( -name "*.js" -o -name "*.scss" -o -name "*.md" \) \
            -exec sed -i 's/\r$//' {} +

      - name: Run linters
        run: npm run lint:all

      - name: Run URL checker
        run: |
          node script/url-checker.js \
            -t "$URL_CHECKER_TIMEOUT" \
            -d src/posts
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run eleventy:prod

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outcome }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          DATE=$(date +%Y-%m-%d)

          if [ "$DEPLOYMENT_STATUS" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

          gh issue create \
            --title "$DATE - Deployment: $STATUS" \
            --body "URL: $DEPLOYMENT_URL"